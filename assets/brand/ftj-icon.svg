<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d3f"/>
      <stop offset="1" stop-color="#2b2b2d"/>
    </linearGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="0" y1="382" x2="0" y2="642">
      <stop offset="0" stop-color="#ef2b33"/>
      <stop offset="1" stop-color="#d0161f"/>
    </linearGradient>
    <linearGradient id="white" gradientUnits="userSpaceOnUse" x1="0" y1="382" x2="0" y2="642">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e6e8"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0.75" y1="0.3" x2="0.2" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="200"/></clipPath>
    <!-- thin gaps that split each stroke into parallel bars -->
    <mask id="stripes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="12">
        <path d="M370 410 H160 V660"/>
        <path d="M330 528 H160"/>
        <path d="M384 410 H630"/>
        <path d="M499 410 V660"/>
        <path d="M644 410 H864 V550 A64 64 0 0 1 800 614 H644"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- long shadow -->
    <polygon points="132,382 892,382 892,600 720,1100 -200,1100" fill="url(#shadow)"/>
    <rect width="1024" height="1024" fill="url(#gloss)"/>

    <g mask="url(#stripes)">
      <!-- F -->
      <g fill="url(#red)">
        <rect x="132" y="382" width="72" height="260"/>
        <rect x="132" y="382" width="230" height="72"/>
        <rect x="132" y="500" width="190" height="64"/>
      </g>
      <!-- T -->
      <g fill="url(#red)">
        <rect x="392" y="382" width="230" height="72"/>
        <rect x="471" y="382" width="72" height="260"/>
      </g>
      <!-- J -->
      <path fill="url(#white)" d="M652 382 H892 V550 A92 92 0 0 1 800 642 H652 V570 H790 A30 30 0 0 0 820 540 V454 H652 Z"/>
    </g>
  </g>
</svg>
